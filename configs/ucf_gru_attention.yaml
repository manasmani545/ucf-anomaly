seed: 42

dataset:
  manifest: data/processed/manifest.csv
  feature_dir: data/raw/ucf_crime/features/hf_download
  num_classes: 2
  feature_dim: 2048
  max_video_len: 750

model:
  name: gru_attention_mil
  k_ratio: 0.25
  hidden_dim: 256

training:
  batch_size: 8
  epochs: 15
  lr: 0.00001
  weight_decay: 0.0001
  num_workers: 0
  checkpoint_dir: checkpoints/ucf_gru_attention
  log_dir: logs/ucf_gru_attention
